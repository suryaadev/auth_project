services:
  mysql:
    image: mysql:8.4-oraclelinux9
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: authdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    image: myuser/auth_backend:latest
    ports:
      - "5000:5000"
    depends_on:
      - mysql
      - redis

  frontend:
    image: myuser/auth_frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
