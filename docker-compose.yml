services:

  mysql:
    image: mysql:8

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: authdb

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7

    ports:
      - "6379:6379"

  backend:
    build: ./backend

    ports:
      - "5000:5000"

    depends_on:
      - mysql
      - redis

  frontend:
    build: ./frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  mysql_data: